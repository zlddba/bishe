name: Release

# 发布的前提（三者缺一不可，verify job 会逐项校验并在日志里指出缺哪个）：
#   1. 存在发布分支 release/vX.Y.Z
#   2. 存在同名 tag vX.Y.Z（且提交在发布分支上）
#   3. 存在发布文档 docs/release/vX.Y.Z.md，正文即 Release 页的发布说明
#
# 触发方式：
#   - 推送 tag：git push origin v2.0.2  （主路径）
#   - 手动重跑：Actions → Release → Run workflow，填 tag（例如 v2.0.2）
#
# 校验通过后并行构建多架构产物，全部成功后自动创建 / 更新 GitHub Release。
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "要发布的 tag（如 v2.0.2，必填；留空则取当前 ref）"
        type: string
        required: false

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  # 发布不取消进行中的同类任务：宁可排队，也不要打断正在上传附件的流程
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  # ---------------------------------------------------------------- 前置校验
  verify:
    name: 校验发布条件
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      tag: ${{ steps.check.outputs.tag }}
      version: ${{ steps.check.outputs.version }}
      doc: ${{ steps.check.outputs.doc }}
    steps:
      # 这里不指定 ref：tag 推送时 checkout 到该 tag，手动触发时留在所选 ref。
      # 具体 tag 由下面的脚本解析并单独 fetch，这样 tag 打错时能给出一句人话，而不是 checkout 报 reference not found。
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 检查分支 / tag / 发布文档
        id: check
        shell: bash
        env:
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail

          TAG="${INPUT_TAG:-}"
          if [[ -z "$TAG" ]]; then
            # 手动触发没填 tag，且当前 ref 不是 tag 时，直接拒绝
            if [[ "${GITHUB_REF_TYPE}" != "tag" ]]; then
              echo "::error::手动触发请填写要发布的 tag（例如 v2.0.2），或直接用 git push origin v2.0.2 触发"
              exit 1
            fi
            TAG="${GITHUB_REF_NAME}"
          fi
          TAG="${TAG#refs/tags/}"

          fail() { echo "::error::$*"; exit 1; }

          [[ "$TAG" == v* ]] || fail "标签必须以 v 开头（例：v2.0.2），当前是 '$TAG'"
          VERSION="${TAG#v}"
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] \
            || fail "标签格式必须是 vX.Y.Z（例：v2.0.2），当前是 '$TAG'"

          BRANCH="release/v${VERSION}"
          DOC="docs/release/v${VERSION}.md"

          # 1) tag 必须存在于远端
          git ls-remote --exit-code --tags origin "refs/tags/${TAG}" >/dev/null 2>&1 \
            || fail "远端不存在 tag ${TAG}，请先 git push origin ${TAG}"
          git fetch --no-tags origin "+refs/tags/${TAG}:refs/tags/${TAG}"
          # 之后所有检查都以该 tag 的提交内容为准：手动触发时工作区可能停在分支上
          git checkout --detach --quiet "refs/tags/${TAG}"

          # 2) 发布分支必须存在
          git ls-remote --exit-code --heads origin "refs/heads/${BRANCH}" >/dev/null 2>&1 \
            || fail "远端不存在发布分支 ${BRANCH}，请先从 master 切出该分支并推送"
          git fetch --no-tags origin "+refs/heads/${BRANCH}:refs/remotes/origin/${BRANCH}"

          # 3) tag 的提交必须落在发布分支上（分支后续可继续提交，tag 不能凭空打）
          TAG_SHA="$(git rev-parse "refs/tags/${TAG}^{commit}")"
          BRANCH_SHA="$(git rev-parse "refs/remotes/origin/${BRANCH}")"
          git merge-base --is-ancestor "$TAG_SHA" "$BRANCH_SHA" \
            || fail "tag ${TAG}（${TAG_SHA:0:8}）不在分支 ${BRANCH}（${BRANCH_SHA:0:8}）上，请把该提交合入发布分支后重新打 tag"

          # 4) 发布文档必须存在且非空，正文即 Release 说明
          [[ -f "$DOC" ]] || fail "缺少发布文档 ${DOC}，请参照 docs/release/TEMPLATE.md 编写后再发布"
          [[ -s "$DOC" ]] || fail "发布文档 ${DOC} 内容为空，Release 正文不能为空"

          echo "标签：${TAG}"
          echo "分支：${BRANCH}"
          echo "发布文档：${DOC}（$(wc -l < "$DOC") 行）"

          {
            echo "tag=${TAG}"
            echo "version=${VERSION}"
            echo "doc=${DOC}"
          } >> "$GITHUB_OUTPUT"

  # ------------------------------------------------- 服务端部署包（amd64 / arm64）
  # 容器镜像不在 CI 里构建：包内只放对应架构的 Go 二进制 + Dockerfile，
  # 由目标架构的服务器本地 build；alpine / nginx 基础镜像都是多架构的。
  bundle:
    name: 部署包 linux/${{ matrix.arch }}
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        arch: [amd64, arm64]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.verify.outputs.tag }}

      - uses: actions/setup-go@v5
        with:
          go-version: "1.25.x"
          cache-dependency-path: server/patnestServer/go.sum

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: webadmin/patnestServerAdminWeb/package-lock.json

      - name: Install web deps
        working-directory: webadmin/patnestServerAdminWeb
        run: npm ci --no-audit --no-fund

      - name: Build bundle
        shell: bash
        run: bash build.sh --version "${{ needs.verify.outputs.version }}" --arch "${{ matrix.arch }}"

      - name: 规范产物名
        shell: bash
        env:
          VERSION: ${{ needs.verify.outputs.version }}
          ARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail
          mkdir -p out
          SRC="release/patnest-server-${VERSION}-linux-${ARCH}.zip"
          [[ -f "$SRC" ]] || { echo "::error::找不到部署包 ${SRC}"; exit 1; }
          cp "$SRC" "out/patnest-server-${VERSION}-linux-${ARCH}.zip"
          ls -lh out

      - uses: actions/upload-artifact@v4
        with:
          name: patnest-server-linux-${{ matrix.arch }}
          path: out/*
          if-no-files-found: error
          retention-days: 14

  # ------------------------------------------------------- 小程序工程源码包
  # 托管 runner 装不了 HBuilderX，所以不编译：只把工程打成 zip，
  # 下载解压后用 HBuilderX 导入，再发行到微信开发者工具。源码包不涉及架构。
  miniapp:
    name: 小程序工程包（uniapp zip）
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.verify.outputs.tag }}

      - name: 打包工程
        shell: bash
        run: |
          set -euo pipefail
          cd uniapp
          NAME="patnest-uniapp-${{ needs.verify.outputs.version }}"
          zip -qr "../${NAME}.zip" patnestUniapp \
            -x "patnestUniapp/unpackage/*" \
               "patnestUniapp/.hbuilderx/*" \
               "patnestUniapp/node_modules/*" \
               "patnestUniapp/.DS_Store"
          echo "已生成 ${NAME}.zip（$(du -h "../${NAME}.zip" | cut -f1)）"

      - uses: actions/upload-artifact@v4
        with:
          name: patnest-uniapp-project
          path: patnest-uniapp-*.zip
          if-no-files-found: error
          retention-days: 14

  # ------------------------------------------------------------ Android APK
  # 只支持 arm64-v8a（androidApp/build.gradle.kts 的 ndk.abiFilters）。
  # 签名、接口地址、高德 Key 全部来自 Secrets，仓库里不存密钥。
  android:
    name: Android APK（arm64）
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.verify.outputs.tag }}

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: wrapper

      # ubuntu-latest 镜像自带 Android SDK 与 cmdline-tools，不需要 setup-android；
      # 该 action 会尝试安装已被 Google 移除的 `tools` 包，从而让整个 job 失败。
      - name: Accept Android SDK licenses
        shell: bash
        run: |
          set -euo pipefail
          SDKM="$(command -v sdkmanager || echo "${ANDROID_HOME:-/usr/local/lib/android/sdk}/cmdline-tools/latest/bin/sdkmanager")"
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" "platforms;android-37" "platform-tools" > /dev/null || true
          echo "Android SDK ready: $SDKM"

      # Android 端构建期读 app/patnestApp/.env 注入接口地址与高德 Key；
      # .env 被 .gitignore 排除，这里按 Secrets 生成一份。
      - name: Write .env
        working-directory: app/patnestApp
        env:
          API_BASE: ${{ vars.PATNEST_API_BASE || secrets.PATNEST_API_BASE }}
          AMAP_KEY: ${{ secrets.PATNEST_AMAP_ANDROID_KEY }}
        run: |
          set -euo pipefail
          if [[ -z "${API_BASE:-}" ]]; then
            echo "::warning::未配置 PATNEST_API_BASE（Variables 或 Secrets），APK 将指向本机地址，装到手机上连不上后端"
          fi
          API="${API_BASE:-http://127.0.0.1:9200/api/v1}"
          printf 'PATNEST_API_BASE=%s\nPATNEST_AMAP_ANDROID_KEY=%s\n' "$API" "${AMAP_KEY:-}" > .env
          echo "API_BASE=$API"

      - name: Decode keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.PATNEST_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          if [[ -z "${KEYSTORE_BASE64:-}" ]]; then
            echo "::error::缺少 Secrets.PATNEST_KEYSTORE_BASE64，release 构建无法签名"
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/patnest_release.jks"
          echo "PATNEST_RELEASE_KEYSTORE=$RUNNER_TEMP/patnest_release.jks" >> "$GITHUB_ENV"

      - name: Assemble release
        working-directory: app/patnestApp
        env:
          PATNEST_VERSION: ${{ needs.verify.outputs.version }}
          # versionCode 必须是单调递增的整数；用 workflow 的运行序号天然满足
          PATNEST_VERSION_CODE: ${{ github.run_number }}
          PATNEST_RELEASE_STORE_PASSWORD: ${{ secrets.PATNEST_STORE_PASSWORD }}
          PATNEST_RELEASE_KEY_PASSWORD: ${{ secrets.PATNEST_KEY_PASSWORD }}
          PATNEST_RELEASE_KEY_ALIAS: ${{ secrets.PATNEST_KEY_ALIAS }}
        run: sh ./gradlew :androidApp:assembleRelease --no-daemon --stacktrace

      - name: 规范产物名并校验 ABI
        shell: bash
        env:
          VERSION: ${{ needs.verify.outputs.version }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          APKS=(app/patnestApp/androidApp/build/outputs/apk/release/*.apk)
          [[ ${#APKS[@]} -gt 0 ]] || { echo "::error::没有找到 release APK"; exit 1; }
          APK="${APKS[0]}"
          # 先收进变量再 grep，避免 pipefail + SIGPIPE 让校验被误判为通过
          LIBS="$(unzip -l "$APK")"
          if grep -q 'lib/armeabi-v7a/' <<< "$LIBS"; then
            echo "::error::APK 里仍有 32 位 ARM 库，abiFilters 未生效"
            exit 1
          fi
          mkdir -p out
          cp "$APK" "out/patnest-${VERSION}-android-arm64.apk"
          ls -lh out

      - uses: actions/upload-artifact@v4
        with:
          name: patnest-android-apk
          path: out/*
          if-no-files-found: error
          retention-days: 14

  # ------------------------------------------- 桌面端 Linux（amd64 / arm64）
  # jpackage 不支持交叉打包，所以两种架构各在对应架构的 runner 上跑一次。
  # Compose 的 TargetFormat.AppImage 是「app-image 目录」，不是 AppImage 单文件；
  # 真正的 .AppImage 要再用 appimagetool（对应架构版本）封成一体包。
  linux:
    name: 桌面端 Linux ${{ matrix.arch }}（deb / rpm / AppImage / tar.gz）
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
            appimage_tool: appimagetool-x86_64.AppImage
            appimage_arch: x86_64
          - arch: arm64
            runner: ubuntu-24.04-arm
            appimage_tool: appimagetool-aarch64.AppImage
            appimage_arch: aarch64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    steps:
      # jpackage 打的是当前架构的包，先确认 runner 没跑错，避免产出名不副实的 arm64 包
      - name: 校验 runner 架构
        shell: bash
        env:
          ARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail
          M="$(uname -m)"
          if [[ "$ARCH" == "amd64" ]]; then EXPECT="x86_64"; else EXPECT="aarch64"; fi
          [[ "$M" == "$EXPECT" ]] || { echo "::error::runner 架构不匹配：$M，期望 $EXPECT"; exit 1; }
          echo "runner=$M / target=$ARCH"

      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.verify.outputs.tag }}

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: wrapper

      # jpackage 打 deb 需要 fakeroot，打 rpm 需要 rpmbuild
      - name: 安装 Linux 打包依赖
        run: sudo apt-get update && sudo apt-get install -y fakeroot rpm

      - name: 构建 Linux 安装包与绿色版目录
        working-directory: app/patnestApp
        shell: bash
        env:
          PATNEST_VERSION: ${{ needs.verify.outputs.version }}
          PATNEST_API_BASE: ${{ vars.PATNEST_API_BASE || secrets.PATNEST_API_BASE }}
        run: sh ./gradlew :desktopApp:packageDeb :desktopApp:packageRpm :desktopApp:createDistributable --no-daemon --stacktrace

      - name: 生成四种格式并规范命名
        working-directory: app/patnestApp
        shell: bash
        env:
          VERSION: ${{ needs.verify.outputs.version }}
          ARCH: ${{ matrix.arch }}
          APPIMAGE_TOOL: ${{ matrix.appimage_tool }}
          APPIMAGE_ARCH: ${{ matrix.appimage_arch }}
        run: |
          set -euo pipefail
          BIN="desktopApp/build/compose/binaries/main"
          shopt -s nullglob
          APPDIRS=("$BIN"/app/*/)
          [[ ${#APPDIRS[@]} -gt 0 ]] || { echo "::error::找不到 createDistributable 产出的 app-image 目录"; exit 1; }
          APPDIR="${APPDIRS[0]}"
          NAME="patnest-${VERSION}-linux-${ARCH}"
          mkdir -p out

          # 绿色版：解压后直接运行 bin/ 下的启动器，自带 lib/runtime，无需安装 Java
          mkdir -p "out/$NAME"
          cp -a "$APPDIR/." "out/$NAME/"
          tar -czf "out/$NAME.tar.gz" -C out "$NAME"
          rm -rf "out/$NAME"

          # AppImage：把 app-image 整体挂到 AppDir/usr，启动器仍按相对路径找自带 JVM
          mkdir -p PatNest.AppDir/usr
          cp -a "$APPDIR/." PatNest.AppDir/usr/
          cp desktopApp/src/main/resources/compose-multiplatform.png PatNest.AppDir/patnest.png
          printf '%s\n' '[Desktop Entry]' 'Type=Application' 'Name=PatNest' 'Exec=patnest' 'Icon=patnest' 'Categories=Utility;' > PatNest.AppDir/patnest.desktop
          printf '%s\n' '#!/bin/sh' 'HERE="$(dirname "$(readlink -f "$0")")"' 'BIN="$(find "$HERE/usr/bin" -maxdepth 1 -type f -perm -u+x -print -quit)"' 'exec "$BIN" "$@"' > PatNest.AppDir/AppRun
          chmod +x PatNest.AppDir/AppRun
          curl -fsSL -o /tmp/appimagetool "https://github.com/AppImage/AppImageKit/releases/download/continuous/${APPIMAGE_TOOL}"
          chmod +x /tmp/appimagetool
          (cd /tmp && ./appimagetool --appimage-extract > /dev/null)
          ARCH="$APPIMAGE_ARCH" /tmp/squashfs-root/AppRun PatNest.AppDir "out/${NAME}.AppImage"

          # deb / rpm 由 jpackage 命名（amd64 / arm64 / aarch64），统一改成发行名
          DEBS=("$BIN"/deb/*.deb)
          RPMS=("$BIN"/rpm/*.rpm)
          [[ ${#DEBS[@]} -gt 0 && ${#RPMS[@]} -gt 0 ]] || { echo "::error::deb 或 rpm 产物缺失"; exit 1; }
          DEB="${DEBS[0]}"
          RPM="${RPMS[0]}"
          cp "$DEB" "out/${NAME}.deb"
          cp "$RPM" "out/${NAME}.rpm"
          ls -lh out

      - uses: actions/upload-artifact@v4
        with:
          name: patnest-desktop-linux-${{ matrix.arch }}
          path: app/patnestApp/out/*
          if-no-files-found: error
          retention-days: 14

  # --------------------------------- 桌面端 Windows（x64 / arm64）与 macOS（arm64）
  # macOS 按约定只出 Apple Silicon 版；Windows 两种架构各跑一份。
  desktop:
    name: 桌面端 ${{ matrix.platform }}-${{ matrix.arch }}
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            task: packageMsi
            format: msi
            platform: windows
            arch: x64
          - os: windows-11-arm
            task: packageMsi
            format: msi
            platform: windows
            arch: arm64
          - os: macos-latest
            task: packageDmg
            format: dmg
            platform: macos
            arch: arm64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.verify.outputs.tag }}

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: wrapper

      - name: Package
        working-directory: app/patnestApp
        shell: bash
        env:
          PATNEST_VERSION: ${{ needs.verify.outputs.version }}
          PATNEST_API_BASE: ${{ vars.PATNEST_API_BASE || secrets.PATNEST_API_BASE }}
        run: sh ./gradlew :desktopApp:${{ matrix.task }} --no-daemon --stacktrace

      - name: 规范产物名
        shell: bash
        env:
          VERSION: ${{ needs.verify.outputs.version }}
          PLATFORM: ${{ matrix.platform }}
          ARCH: ${{ matrix.arch }}
          FORMAT: ${{ matrix.format }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          FILES=(app/patnestApp/desktopApp/build/compose/binaries/main/${FORMAT}/*.${FORMAT})
          [[ ${#FILES[@]} -gt 0 ]] || { echo "::error::没有找到 .${FORMAT} 产物"; exit 1; }
          SRC="${FILES[0]}"
          mkdir -p out
          cp "$SRC" "out/patnest-${VERSION}-${PLATFORM}-${ARCH}.${FORMAT}"
          ls -lh out

      - uses: actions/upload-artifact@v4
        with:
          name: patnest-desktop-${{ matrix.platform }}-${{ matrix.arch }}
          path: out/*
          if-no-files-found: error
          retention-days: 14

  # ------------------------------------------------------------- 发布 Release
  # 发布说明直接用 docs/release/vX.Y.Z.md，不在这里重复拼文案：
  # 文档改了什么，Release 页就是什么。
  release:
    name: 发布 GitHub Release
    needs: [verify, bundle, miniapp, android, linux, desktop]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.verify.outputs.tag }}
          fetch-depth: 1

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: 创建或更新 Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.verify.outputs.tag }}
          VERSION: ${{ needs.verify.outputs.version }}
          DOC: ${{ needs.verify.outputs.doc }}
        shell: bash
        run: |
          set -euo pipefail
          # upload-artifact 会按各 glob 的公共前缀保留目录层级，
          # 所以 dist/ 下可能是 dist/desktopApp/... 和 dist/dist/... 这样的嵌套结构。
          # 必须只取「文件」，直接 dist/* 会把目录当附件传给 gh 并报错。
          mapfile -t ASSETS < <(find dist -type f -print | sort)
          if (( ${#ASSETS[@]} == 0 )); then
            echo "::error::没有找到任何构建产物，拒绝发布空 Release"
            exit 1
          fi
          printf '附件 %s 个：\n' "${#ASSETS[@]}"
          printf '  %s\n' "${ASSETS[@]}"
          TITLE="PatNest 宠栖 ${VERSION}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "::notice::$TAG 已存在 Release，按发布文档覆盖更新"
            gh release edit "$TAG" --title "$TITLE" --notes-file "$DOC"
            gh release upload "$TAG" "${ASSETS[@]}" --clobber
          else
            gh release create "$TAG" --title "$TITLE" --notes-file "$DOC" "${ASSETS[@]}"
          fi
          echo "发布完成：$(gh release view "$TAG" --json url -q .url)"
