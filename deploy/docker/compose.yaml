# PatNest 后端一体包：Nginx（管理页面 + API 入口）、Redis、Go API（蓝绿双槽位）
#
# 本包的 artifacts/ 与 web/dist/ 已在本机构建好，服务器只需打包镜像：
#   podman-compose --profile app up -d --build
#
# 更新后端：替换 artifacts/patnest-api 后
#   bash scripts/release-api.sh   /   .\scripts\release-api.ps1
# 更新管理页面：替换 web/dist/ 后
#   bash scripts/release-web.sh   /   .\scripts\release-web.ps1

x-api: &api
  image: patnest-api:${APP_VERSION:-1.0.0}
  env_file: .env
  volumes:
    - ./data/updates:/var/lib/patnest/updates
    # 证书目录：后台「HTTPS 证书」上传时由 API 写入，nginx 容器读同一份
    - ./nginx/tls:/var/lib/patnest/tls
    # acme.sh 的账户密钥 / 证书元数据，删掉它等于让 Let's Encrypt 重新注册账户
    - ./data/acme:/var/lib/patnest/acme
  depends_on:
    - redis
  restart: unless-stopped
  healthcheck:
    # 探活地址跟着 SERVER_SCHEME 走：
    # http → http://127.0.0.1:9201/health；https → https:// + 跳过证书校验（证书是给域名签的）
    test:
      - CMD-SHELL
      - >-
        if [ "$${SERVER_SCHEME}" = "https" ]; then
          wget -qO- --no-check-certificate https://127.0.0.1:9201/health;
        else
          wget -qO- http://127.0.0.1:9201/health;
        fi || exit 1
    interval: 15s
    timeout: 5s
    retries: 5
    start_period: 20s

services:
  redis:
    profiles: ["app", "tools"]
    image: redis:latest
    pull_policy: always
    container_name: patnest-redis
    command:
      - redis-server
      - --appendonly
      - "yes"
      - --requirepass
      - ${REDIS_PASSWORD:-patnest_redis_change_me}
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:-patnest_redis_change_me}
    volumes:
      - ./data/redis:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" ping | grep -q PONG"]
      interval: 10s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  api-blue:
    <<: *api
    profiles: ["app"]
    container_name: patnest-api-blue
    build:
      context: .
      dockerfile: docker/Dockerfile.api
      pull: true
    environment:
      APP_PORT: "9201"
      APP_SLOT: "blue"
      REDIS_ADDR: "redis:6379"
      # 后端启动时的初始协议：http（默认）或 https。
      # 真正的开关在后台「系统更新 → HTTPS 证书」里，页面上切即时生效。
      SERVER_SCHEME: "${SERVER_SCHEME:-http}"
      UPDATE_DIR: "/var/lib/patnest/updates"

  api-green:
    <<: *api
    profiles: ["app"]
    container_name: patnest-api-green
    environment:
      APP_PORT: "9201"
      APP_SLOT: "green"
      REDIS_ADDR: "redis:6379"
      SERVER_SCHEME: "${SERVER_SCHEME:-http}"
      UPDATE_DIR: "/var/lib/patnest/updates"

  nginx:
    profiles: ["app"]
    image: patnest-web:${APP_VERSION:-1.0.0}
    build:
      context: .
      dockerfile: docker/Dockerfile.web
      pull: true
      # /files/ 反代目标在构建时写进 nginx 配置；从 .env 取，和后端同一份来源
      args:
        MINIO_SCHEME: "${MINIO_SCHEME:-http}"
        MINIO_ENDPOINT: "${MINIO_ENDPOINT:-zdz1.linkzdsada.dpdns.org:9000}"
        MINIO_BUCKET: "${MINIO_BUCKET:-patnest-uploads}"
    container_name: patnest-nginx
    ports:
      # 只对外暴露 9200：容器内由 stream + ssl_preread 分流，TLS 交给本机 8443
      # 终结，明文交给本机 8080，所以 http 与 https 共用这一个端口，443 仍然不开放。
      #
      # Let's Encrypt 证书走 DNS-01（Cloudflare TXT 记录）验证，不需要 80 端口，
      # 所以这里不开 80，宿主机上留给别的服务用。
      - "${PUBLIC_PORT:-9200}:9200"
    volumes:
      - ./nginx/upstream.conf:/etc/nginx/patnest/upstream.conf:ro
      # 反代协议：后端跑 https 时这里要跟着换，发布脚本按 SERVER_SCHEME 重写
      - ./nginx/api_proxy.conf:/etc/nginx/patnest/api_proxy.conf:ro
      # TLS 证书：后台上传后由 API 写入同一目录，nginx 从这里读取并终结 9200 的 HTTPS
      - ./nginx/tls:/etc/nginx/patnest/tls:ro
    depends_on:
      - api-blue
    restart: unless-stopped

  migrate:
    profiles: ["tools"]
    image: patnest-api:${APP_VERSION:-1.0.0}
    env_file: .env
    entrypoint: ["/app/patnest-migrate"]
    # -init：库结构为空时自动执行基线（建库 + 建表 + seed），
    # 已存在的库直接跳过，只走增量迁移。
    command: ["-dir", "/app/migrations", "-init", "/app/init.sql"]
    restart: "no"

  updates-init:
    profiles: ["tools"]
    image: alpine:latest
    pull_policy: always
    volumes:
      - ./data/updates:/updates
    command:
      - sh
      - -c
      - >-
        mkdir -p /updates/tmp /updates/manual /updates/queue /updates/processing
        /updates/inbox
        /updates/failed /updates/status /updates/staging /updates/logs /updates/backups
        && chmod -R a+rwX /updates
    restart: "no"

  # 容器化的更新代理（AGENT_MODE=container，默认）。
  #
  # 安全提示：挂载 docker.sock 等于把宿主机容器引擎的控制权交给这个容器，
  # 因为它要执行 `docker compose build/up` 来发布新版本。
  #
  # 路径说明：部署包挂到容器内固定路径 /pkg，不要求宿主机同路径。
  # entrypoint 用 docker inspect 反查挂载源在 daemon 侧的真实路径，再以它作为
  # compose 的项目目录，因此 Linux 与 Windows（Docker Desktop）表现一致。
  # PACKAGE_HOST_PATH 是部署包在本机上的路径，install 脚本会自动写入 .env。
  update-agent:
    profiles: ["agent"]
    image: patnest-update-agent:${APP_VERSION:-1.0.0}
    build:
      context: .
      dockerfile: docker/Dockerfile.agent
      pull: true
    container_name: patnest-update-agent
    environment:
      PACKAGE_ROOT: /pkg
      PACKAGE_HOST_ROOT: ${PACKAGE_HOST_ROOT:-}
      POLL_SECONDS: ${POLL_SECONDS:-3}
      PATNEST_AGENT_CONTAINER: "1"
    volumes:
      - ${DOCKER_SOCKET:-/var/run/docker.sock}:/var/run/docker.sock
      - ${PACKAGE_HOST_PATH:-.}:/pkg
    working_dir: /pkg
    # 不设 cap_drop：代理要覆盖 artifacts/ / web/dist/ / .env / nginx/upstream.conf，
    # 去掉 CAP_DAC_OVERRIDE 后 root 会被普通文件权限挡住，发布必然失败。
    # 而且挂载 docker.sock 已经是宿主机级权限，cap_drop 在这里给不了额外边界。
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
