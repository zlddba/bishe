# 9200（HTTP）与 443（HTTPS）两个 server 共用的规则。
# 抽出来是为了不重复：证书配好以后两套监听必须完全一致，
# 否则很容易出现「HTTP 能传图、HTTPS 传不了」这种只在一边改了的问题。
#
# 本文件被 include 在 server 块内，所以这里只放 server 级指令和 location。

root /usr/share/nginx/html;
index index.html;

client_max_body_size 10m;
server_tokens off;

gzip on;
gzip_min_length 1024;
gzip_types text/plain text/css application/json application/javascript image/svg+xml;

location = /version.json {
    add_header Cache-Control "no-store, must-revalidate";
    try_files $uri =404;
}

location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
}

# 图片统一走本站域名：/files/uploads/xxx.jpg → 对象存储的 bucket。
# 这样小程序/浏览器只需要认一个业务域名，对象存储不必暴露公网，
# 也不用给它单独申请域名和 HTTPS 证书。
# proxy_pass 末尾带 / 会把 /files/ 前缀剥掉，路径原样转给对象存储。
location /files/ {
    proxy_pass @@MINIO_SCHEME@@://@@MINIO_ENDPOINT@@/@@MINIO_BUCKET@@/;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host @@MINIO_ENDPOINT@@;
    proxy_hide_header x-amz-request-id;
    proxy_hide_header x-amz-id-2;
    expires 30d;
    add_header Cache-Control "public, max-age=2592000, immutable";
    add_header X-Content-Type-Options nosniff;
}

location /api/ {
    proxy_pass http://patnest_api;
    # 更新包上传最大 512MB，与后端 UPDATE_MAX_MB 默认值保持一致。
    client_max_body_size 512m;
    client_body_timeout 300s;
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    # HTTPS 监听时 $scheme=https，后端据此生成正确的回调/重定向地址
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 5s;
    proxy_next_upstream error timeout http_502 http_503;
}

location = /health {
    proxy_pass http://patnest_api;
    access_log off;
}

location / {
    try_files $uri $uri/ /index.html;
    add_header Cache-Control "no-cache";
}
