# 9200 server 里的规则（站点只监听 9200，HTTPS 由后端自己在同一个端口终结）。
#
# 本文件被 include 在 server 块内，所以这里只放 server 级指令和 location。

root /usr/share/nginx/html;
index index.html;

client_max_body_size 10m;
server_tokens off;

gzip on;
gzip_min_length 1024;
gzip_types text/plain text/css application/json application/javascript image/svg+xml;

location = /version.json {
    add_header Cache-Control "no-store, must-revalidate";
    try_files $uri =404;
}

location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
}

# 后端自己终结 TLS 时（API 容器 SERVER_SCHEME=https），nginx 要用 https 连上游。
# 证书是给域名签的，跟上游主机名对不上，所以不校验证书链。
proxy_ssl_verify off;
proxy_ssl_server_name on;
proxy_ssl_protocols TLSv1.2 TLSv1.3;

# 图片统一走本站域名：/files/uploads/xxx.jpg → 对象存储的 bucket。
# 这样小程序/浏览器只需要认一个业务域名，对象存储不必暴露公网，
# 也不用给它单独申请域名和 HTTPS 证书。
# proxy_pass 末尾带 / 会把 /files/ 前缀剥掉，路径原样转给对象存储。
location /files/ {
    proxy_pass @@MINIO_SCHEME@@://@@MINIO_ENDPOINT@@/@@MINIO_BUCKET@@/;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host @@MINIO_ENDPOINT@@;
    proxy_hide_header x-amz-request-id;
    proxy_hide_header x-amz-id-2;
    expires 30d;
    add_header Cache-Control "public, max-age=2592000, immutable";
    add_header X-Content-Type-Options nosniff;
}

# Swagger UI 与 OpenAPI 文档由 Go 后端直接提供（静态资源内嵌在二进制里）。
# 不放行这两条路径就会被下面的 SPA 回退吃掉，页面拿到的是管理后台首页。
# 反代协议沿用 api_proxy.conf，后端切换 https 时这里不用跟着改。
location = /swagger {
    return 301 /swagger/index.html;
}

location = /swagger.json {
    include /etc/nginx/patnest/api_proxy.conf;
}

location /swagger/ {
    include /etc/nginx/patnest/api_proxy.conf;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 5s;
}

location /api/ {
    # 反代协议由 api_proxy.conf 决定：后端跑 http 就写 http，跑 https 就写 https。
    include /etc/nginx/patnest/api_proxy.conf;
    # 更新包上传最大 512MB，与后端 UPDATE_MAX_MB 默认值保持一致。
    client_max_body_size 512m;
    client_body_timeout 300s;
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    # HTTPS 监听时 $scheme=https，后端据此生成正确的回调/重定向地址
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 5s;
    proxy_next_upstream error timeout http_502 http_503;
}

location = /health {
    include /etc/nginx/patnest/api_proxy.conf;
    access_log off;
}

location / {
    try_files $uri $uri/ /index.html;
    add_header Cache-Control "no-cache";
}
