# PatNest web 层主配置。
#
# 对外只有一个端口（9200），http 与 https 同时可用：
#   - stream 块用 ssl_preread 看首字节，是 TLS 握手就转给本机 8443（nginx 自己终结 TLS），
#     其余（明文 HTTP）转给本机 8080；
#   - 转发时带 PROXY protocol，HTTP 层用 real_ip 还原真实客户端 IP，
#     否则所有请求的 $remote_addr 都是 127.0.0.1，登录限流会把全网算成同一个人。
#
# 之前的设计是「后端在 9200 上自己终结 TLS」，但容器部署里 9200 被 nginx 占用、
# API 只在内网 9201，客户端根本到不了后端，所以 TLS 改由 nginx 终结。

worker_processes auto;
# Worker processes drop to the nginx user; the master stays root so it can read
# the private key (0600, owned by the API container uid) at startup.
user nginx;
error_log /var/log/nginx/error.log notice;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';

    access_log /var/log/nginx/access.log main;

    sendfile on;
    keepalive_timeout 65;

    include /etc/nginx/conf.d/*.conf;
}

stream {
    # $ssl_preread_protocol 非空表示这是一个 TLS 连接。
    map $ssl_preread_protocol $patnest_web_upstream {
        ""      127.0.0.1:8080;
        default 127.0.0.1:8443;
    }

    server {
        listen 9200;
        ssl_preread on;
        proxy_pass $patnest_web_upstream;
        proxy_protocol on;
        proxy_connect_timeout 5s;
        proxy_timeout 30m;
    }
}
