# 容器内监听 9200（HTTP）；443 由后台生成的 https.conf 提供，见文件末尾的 include。
#
# @@MINIO_SCHEME@@ / @@MINIO_ENDPOINT@@ / @@MINIO_BUCKET@@ 是构建时占位符：
# Dockerfile.web 用 build args 里的值替换它们再放进镜像。
# 之所以不在容器启动时 envsubst，是因为 Windows Docker 下「把单个模板文件挂进
# 一个不存在的目录」不可靠（实测挂载不生效），构建时替换更稳。
upstream patnest_api {
    include /etc/nginx/patnest/upstream.conf;
    keepalive 16;
}

server {
    listen 9200;
    server_name _;

    include /etc/nginx/patnest/locations.conf;
}

# 443 的 server 块由后台「系统更新 → HTTPS 证书」生成并写入 tls 目录。
# 未配置证书时该文件只有注释，include 进来相当于什么都不做。
include /etc/nginx/patnest/tls/https.conf;
