# 容器内有两个监听口，都由 nginx.conf 的 stream 块从 9200 转发过来：
#   127.0.0.1:8080 明文 HTTP
#   127.0.0.1:8443 HTTPS（证书来自挂载的 /etc/nginx/patnest/tls）
# 两个 server 共用同一份 locations.conf，所以管理页面、/api、/files 在
# http 与 https 下行为完全一致。
#
# 注意：这里不监听 80。Let's Encrypt 证书走 DNS-01 验证（Cloudflare TXT 记录），
# 不需要 HTTP-01 的验证目录，宿主机 80 端口留给别的服务。
#
# @@MINIO_SCHEME@@ / @@MINIO_ENDPOINT@@ / @@MINIO_BUCKET@@ 是构建时占位符：
# Dockerfile.web 用 build args 里的值替换它们再放进镜像。
# 之所以不在容器启动时 envsubst，是因为 Windows Docker 下「把单个模板文件挂进
# 一个不存在的目录」不可靠（实测挂载不生效），构建时替换更稳。
upstream patnest_api {
    include /etc/nginx/patnest/upstream.conf;
    keepalive 16;
}

server {
    listen 127.0.0.1:8080 proxy_protocol;
    server_name _;

    # stream 层会带 PROXY protocol 头，这里据此还原真实客户端 IP，
    # 否则访问日志和限流的 $remote_addr 全是 127.0.0.1。
    set_real_ip_from 127.0.0.1;
    real_ip_header proxy_protocol;

    include /etc/nginx/patnest/locations.conf;
}

server {
    listen 127.0.0.1:8443 ssl proxy_protocol;
    server_name _;

    set_real_ip_from 127.0.0.1;
    real_ip_header proxy_protocol;

    # 证书由后台上传，落在挂载目录里；nginx 启动时必须存在。
    # install.sh 在没有证书时会先生成一张自签名占位证书。
    ssl_certificate     /etc/nginx/patnest/tls/fullchain.pem;
    ssl_certificate_key /etc/nginx/patnest/tls/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1h;

    include /etc/nginx/patnest/locations.conf;
}
