# /etc/nginx/conf.d/patnest.conf
# 管理面板静态站点 + API 反向代理，蓝绿切换只改 upstream.conf 一个文件。

upstream patnest_api {
    include /etc/nginx/patnest/upstream.conf;
    keepalive 32;
}

server {
    listen 80;
    server_name _;

    root /opt/patnest/web/current;
    index index.html;

    client_max_body_size 10m;
    gzip on;
    gzip_types text/plain text/css application/json application/javascript image/svg+xml;

    # 版本探测文件不能缓存，否则管理面板察觉不到新发布
    location = /version.json {
        add_header Cache-Control "no-store, must-revalidate";
        try_files $uri =404;
    }

    # 构建产物带内容哈希，可以长期缓存
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    location /api/ {
        proxy_pass http://patnest_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
        proxy_next_upstream error timeout http_502 http_503;
    }

    location = /health {
        proxy_pass http://patnest_api;
        access_log off;
    }

    # 单页应用路由回退，入口文件不缓存以保证热更新立即生效
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }
}
