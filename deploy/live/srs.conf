# PatNest 直播用 SRS 6 配置
# 端口：9201 = RTMP（推流/播放），9202 = HTTP（HLS 与 HTTP-FLV），1985 = SRS 自身 API（仅容器内）
# 推流地址：rtmp://<host>:9201/live/<stream_key>
# 播放地址：http://<host>:9202/live/<stream_key>.m3u8 与 .flv

listen              9201;
max_connections     1000;
daemon              off;
srs_log_tank        console;

http_server {
    enabled         on;
    listen          9202;
    dir             ./objs/nginx/html;
    # 观看端多在浏览器 / 小程序里，必须允许跨域拉流
    crossdomain     on;
}

http_api {
    enabled         on;
    listen          1985;
}

vhost __defaultVhost__ {
    hls {
        enabled         on;
        hls_path        ./objs/nginx/html;
        hls_fragment    1;      # 1s 切片：HLS 端延迟从 4-6s 压到 2-3s
        hls_window      6;      # 只保留 6s，播放器不会追旧切片
        hls_dispose     30;     # 停播 30s 后清理切片，避免磁盘越积越多
        hls_m3u8_file   [app]/[stream].m3u8;
        hls_ts_file     [app]/[stream]-[seq].ts;
        hls_cleanup     on;
    }

    # 低延迟的 HTTP-FLV：服务端不切片、不缓存，App / 桌面端优先用它（1-2s）
    http_remux {
        enabled     on;
        mount       [vhost]/[app]/[stream].flv;
        hstrs       on;
    }

    play {
        gop_cache       off;    # 关掉 GOP 缓存，首帧不再等一个关键帧，代价是起播稍慢
        queue_length    5;      # 单连接排队帧数越少越实时
        mw_latency      100;
    }
}
